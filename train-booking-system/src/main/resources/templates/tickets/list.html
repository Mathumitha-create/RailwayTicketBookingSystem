<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Ticket List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #2c3e50;
            text-align: left;
            margin-bottom: 25px;
            border-bottom: 3px solid #3498db;
            display: inline-block;
            padding-bottom: 5px;
        }

        .create-btn {
            display: inline-block;
            background-color: #9b59b6;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 35px;
            transition: background-color 0.3s ease;
        }

        .create-btn:hover {
            background-color: #8e44ad;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        thead tr {
            background-color: #3498db;
            color: white;
            text-align: left;
        }

        th {
            padding: 12px 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tbody tr {
            border-bottom: 1px solid #dddddd;
            transition: background-color 0.2s ease;
        }

        tbody tr:nth-of-type(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #f0f0f0;
        }

        td {
            padding: 10px 15px;
            vertical-align: middle;
        }

        td a {
            color: #3498db;
            text-decoration: none;
            margin: 0 5px;
            transition: color 0.2s ease;
        }

        td a:hover {
            color: #2c3e50;
            text-decoration: underline;
        }
        
        tbody tr:last-child td[colspan="8"] {
            text-align: center;
            font-style: italic;
            color: #7f8c8d;
            padding: 20px;
        }
    </style>
</head>

<body>
    <h1>Ticket List</h1>

    <a th:href="@{/tickets/new}" class="create-btn">Create New Ticket</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Train</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Booking Date</th>
                <th>Final Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.id}"></td>
                <td th:text="${ticket.user != null ? ticket.user.name : 'N/A'}"></td>
                <td th:text="${ticket.train != null ? ticket.train.name : 'N/A'}"></td>
                <td th:text="${ticket.train != null ? ticket.train.source : '-'}"></td>
                <td th:text="${ticket.train != null ? ticket.train.destination : '-'}"></td>
                <td th:text="${#temporals.format(ticket.bookingDate, 'dd-MM-yyyy HH:mm')}"></td>
                <td th:text="'$' + ${#numbers.formatDecimal(ticket.finalPrice, 0, 'COMMA', 2, 'POINT')}"></td>
                <td>
                    <a th:href="@{/tickets/edit/{id}(id=${ticket.id})}">Edit</a> |
                    <a th:href="@{/tickets/delete/{id}(id=${ticket.id})}"
                        onclick="return confirm('Are you sure you want to delete this ticket?');">
                        Delete
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tickets)}">
                <td colspan="8">No tickets found</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
