<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Train Management</h1>

    <!-- Train Search Form -->
    <form action="/trains/search" method="get">
        <label for="trainNumber">Train Number:</label>
        <input type="text" id="trainNumber" name="trainNumber">

        <label for="source">Source:</label>
        <input type="text" id="source" name="source">

        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination">

        <button type="submit">Search Trains</button>
    </form>

    <!-- Train List Table -->
    <h2>Available Trains</h2>
    <table>
        <thead>
            <tr>
                <th>Train Number</th>
                <th>Name</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Departure Time</th>
                <th>Arrival Time</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>12345</td>
                <td>Express Train</td>
                <td>New York</td>
                <td>Los Angeles</td>
                <td>08:00 AM</td>
                <td>06:00 PM</td>
                <td>
                    <a href="#" class="action-btn action-edit">Edit</a>
                    <a href="#" class="action-btn action-delete">Delete</a>
                </td>
            </tr>
            <tr>
                <td>67890</td>
                <td>Local Train</td>
                <td>Chicago</td>
                <td>Boston</td>
                <td>09:30 AM</td>
                <td>02:00 PM</td>
                <td>
                    <a href="#" class="action-btn action-edit">Edit</a>
                    <a href="#" class="action-btn action-delete">Delete</a>
                </td>
            </tr>
            <!-- Add more rows as needed -->
        </tbody>
    </table>
</body>
</html>
