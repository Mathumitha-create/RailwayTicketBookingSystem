<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Trains</title>
    <style>
        /* Basic reset and typography */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6; /* Light, neutral background */
            color: #333;
            margin: 0;
            padding: 30px;
        }

        /* Main Heading */
        h1 {
            color: #2c3e50;
            text-align: left;
            margin-bottom: 25px;
            border-bottom: 3px solid #3498db;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Add New Train Link Button (Blue-Purple color) */
        .create-btn {
            display: inline-block;
            background-color: #9b59b6; 
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            /* Increased margin below the button to create more separation */
            margin-bottom: 35px; 
            transition: background-color 0.3s ease;
        }

        .create-btn:hover {
            background-color: #8e44ad;
        }

        /* Table Container Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Table Header */
        thead tr {
            background-color: #3498db;
            color: white;
            text-align: left;
        }

        th {
            padding: 12px 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Table Body Rows */
        tbody tr {
            border-bottom: 1px solid #dddddd;
            transition: background-color 0.2s ease;
        }

        tbody tr:nth-of-type(even) {
            background-color: #f9f9f9; /* Zebra striping */
        }

        tbody tr:hover {
            background-color: #f0f0f0; /* Highlight row on hover */
        }

        td {
            padding: 10px 15px;
            vertical-align: middle;
        }

        /* Align numeric/currency data to the right */
        td:nth-child(5), /* Base Price */
        td:nth-child(6) { /* Discount % */
            text-align: right;
        }

        /* Action Links Styling */
        td a {
            color: #3498db; 
            text-decoration: none;
            margin-right: 10px;
            transition: color 0.2s ease;
        }

        td a:hover {
            color: #2c3e50;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>Trains</h1>
    <a th:href="@{/trains/new}" class="create-btn">Add New Train</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Base Price</th>
                <th>Discount %</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="train : ${trains}">
                <td th:text="${train.id}"></td>
                <td th:text="${train.name}"></td>
                <td th:text="${train.source}"></td>
                <td th:text="${train.destination}"></td>
                
                <td th:text="'$' + ${#numbers.formatDecimal(train.basePrice, 0, 'COMMA', 2, 'POINT')}"></td>
                
                <td th:text="${#numbers.formatDecimal(train.discountPercentage, 0, 'COMMA', 2, 'POINT') + '%'}"></td>
                
                <td>
                    <a th:href="@{/trains/edit/{id}(id=${train.id})}">Edit</a>
                    <a th:href="@{/trains/delete/{id}(id=${train.id})}"
                       onclick="return confirm('Are you sure you want to delete this train?');">
                        Delete
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

</body>

</html>
