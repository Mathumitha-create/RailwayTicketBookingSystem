<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User List</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #ffffff 100%);
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #2c3e50;
            border-left: 5px solid #9b59b6;
            padding-left: 12px;
            margin-bottom: 25px;
        }

        .create-btn {
            display: inline-block;
            background: #9b59b6;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
            margin-bottom: 20px;
        }

        .create-btn:hover {
            background: #8e44ad;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
        }

        thead {
            background-color: #9b59b6;
            color: white;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #f1ecf8;
        }

        td a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            margin-right: 10px;
        }

        td a:hover {
            text-decoration: underline;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Management</h1>
        <a href="/users/new" class="create-btn">+ Add New User</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <a th:href="@{/users/edit/{id}(id=${user.id})}">Edit</a>
                        <a th:href="@{/users/delete/{id}(id=${user.id})}" 
                           onclick="return confirm('Delete this user?');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
